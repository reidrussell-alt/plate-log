<div class="edit-section">

<div class="edit-helper">Date applies to the whole workout session.</div>
</div>
<div class="edit-label" style="margin-bottom: 8px;">Dumbbell Bench Press: sets</div>
<div class="edit-set-row">

</textarea>
</div>

</textarea>
</div>
