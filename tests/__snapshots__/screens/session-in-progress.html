<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" stroke="none">
<circle cx="12" cy="5" r="1.5">
</circle>
<circle cx="12" cy="12" r="1.5">
</circle>
<circle cx="12" cy="19" r="1.5">
</circle>
</svg>
